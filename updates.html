  <script>

    document.getElementById('updates').innerHTML = UPDATES.map((u, i) => `

        <span class="absolute -left-[9px] top-1.5 w-4 h-4 rounded-full border-2 border-vedic-gold ${i === 0 ? 'bg-vedic-deepred' : 'bg-[#FAF7F2]'}"></span>

        <ul class="mt-2 space-y-1.5 text-[17px] leading-relaxed text-stone-800 list-disc pl-5 marker:text-vedic-gold">
