  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(() => {});</script>
  <script>
    // Footer buttons are icon-only; the translated word is their accessible name and tooltip
    function setName(id, text) { const el = document.getElementById(id); el.setAttribute('aria-label', text); el.title = text; }
    const params = new URLSearchParams(location.search);
    const dayNum = Math.min(10, Math.max(1, parseInt(params.get('day'), 10) || todayDay()));
    const day = DAYS[dayNum - 1];
    let stepIdx = Math.min(day.steps.length - 1, Math.max(0, (parseInt(params.get('step'), 10) || 1) - 1));
    let lang = initialLang();

    function todayDay() {
      const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Los_Angeles' }).format(new Date());
      const idx = DAYS.findIndex(d => d.date === parts);
      return idx === -1 ? 1 : idx + 1;
    }

    function stepTitle(i) { return day.steps[i].title[lang] || day.steps[i].title.en; }

    function renderChrome() {
      document.documentElement.lang = lang;
      document.getElementById('langPicker').innerHTML = langOptions(lang);
      setName('scheduleLink', UI.schedule[lang]);
      const date = new Date(day.date + 'T12:00:00');
      const dateText = date.toLocaleDateString(lang === 'en' ? 'en-US' : lang + '-IN', { weekday: 'short', month: 'short', day: 'numeric' });
      // The thithi follows the date on wider screens, and gets its own line on phones
      document.getElementById('dayLine').innerHTML = `${escapeHtml(`${UI.day[lang]} ${day.day} · ${dateText}`)}<span class="hidden md:inline"> · </span><span class="block md:inline">${escapeHtml(day.thithi[lang] || day.thithi.en)}</span>`;
      const alank = document.getElementById('alankaramLine');
      alank.textContent = day.alankaram[lang];
      alank.lang = lang;
      document.getElementById('stepPicker').innerHTML = day.steps
        .map((s, i) => `<option value="${i}"${i === stepIdx ? ' selected' : ''}>${i + 1}. ${escapeHtml(stepTitle(i))}</option>`).join('');
      document.getElementById('bhajansLink').href = `bhajans.html?lang=${lang}&day=${day.day}&step=${stepIdx + 1}`;
      setName('bhajansLink', UI.bhajans[lang]);
    }

    function renderNav() {
      const prev = document.getElementById('prevBtn');
      setName('prevBtn', UI.prev[lang]);
      prev.disabled = stepIdx === 0;
      const isLast = stepIdx === day.steps.length - 1;
      document.getElementById('nextLabel').textContent = isLast ? '' : UI.next[lang];
      document.getElementById('nextTitle').textContent = isLast ? UI.done[lang] : stepTitle(stepIdx + 1);
      document.getElementById('nextArrow').hidden = isLast;
      // "Puja complete 🙏" steps down a size so it fits on phones
      document.getElementById('nextTitle').classList.toggle('text-xl', !isLast);
      document.getElementById('nextTitle').classList.toggle('text-lg', isLast);
    }

    async function renderStep() {
      const step = day.steps[stepIdx];
      document.getElementById('stepCount').textContent = `${UI.step[lang]} ${stepIdx + 1} ${UI.of[lang]} ${day.steps.length}`;
      const title = document.getElementById('textTitle');
      title.textContent = stepTitle(stepIdx);
      title.lang = lang;
      const body = document.getElementById('textBody');
      body.lang = lang;
      body.innerHTML = '';
      renderNav();
      const text = await loadText(step.text);
      const blocks = text.blocks[lang] || text.blocks.en;
      const { html, headings } = renderBlocks(text.refrain ? shortenRefrains(verseNumbers(blocks)) : blocks, 'step' + stepIdx);
      body.innerHTML = html;

      const note = document.getElementById('textNote');
      note.textContent = text.note ? text.note[lang] || '' : '';
      note.classList.toggle('hidden', !note.textContent);

      const link = document.getElementById('textLink');
      link.classList.toggle('hidden', !text.link);
      if (text.link) { link.href = text.link.href; link.textContent = text.link.label[lang]; }

      const credit = document.getElementById('textCredit');
      credit.classList.toggle('hidden', !text.credit);
      if (text.credit) credit.textContent = text.credit[lang];

      const jump = document.getElementById('sectionJump');
      jump.classList.toggle('hidden', headings.length === 0);
      jump.innerHTML = `<option value="">${UI.sections[lang]}</option>` +
        headings.map(h => `<option value="${h.id}">${escapeHtml(h.label)}</option>`).join('');

      // Preload the next text so Next is instant
      if (stepIdx + 1 < day.steps.length) loadText(day.steps[stepIdx + 1].text);
    }

    function goTo(i) {
      stepIdx = i;
      setUrlParams({ day: day.day, step: stepIdx + 1, lang });
      renderChrome();
      renderStep();
      window.scrollTo({ top: 0 });
    }

    document.getElementById('langPicker').onchange = (e) => {
      lang = e.target.value;
      Prefs.set('pujaLang', lang);
      setUrlParams({ lang });
      renderChrome();
      renderStep();
    };
    document.getElementById('stepPicker').onchange = (e) => goTo(parseInt(e.target.value, 10));
    document.getElementById('prevBtn').onclick = () => stepIdx > 0 && goTo(stepIdx - 1);
    // On the last step, "Puja complete" takes you back to the schedule
    document.getElementById('nextBtn').onclick = () => {
      if (stepIdx < day.steps.length - 1) goTo(stepIdx + 1);
      else location.href = '../index.html';
    };
    // ← / → keys step through the puja (not while a dropdown has focus, where arrows pick options)
    document.addEventListener('keydown', (e) => {
      if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
      if (e.target.closest('select, input, textarea')) return;
      if (e.key === 'ArrowLeft' && stepIdx > 0) goTo(stepIdx - 1);
      else if (e.key === 'ArrowRight' && stepIdx < day.steps.length - 1) goTo(stepIdx + 1);
    });
    document.getElementById('sectionJump').onchange = (e) => {
      const target = document.getElementById(e.target.value);
      AutoScroll.hold(900);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      e.target.value = '';
    };

    setupTextSize(document.querySelector('main'));
    AutoScroll.setup();
    setupToolbarToggle();
    setUrlParams({ day: day.day, step: stepIdx + 1, lang });
    renderChrome();
    renderStep();
  </script>
