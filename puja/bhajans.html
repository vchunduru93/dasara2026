      <h1 class="text-2xl md:text-4xl font-extrabold font-title tracking-wider text-amber-100 mt-1">🎶 Bhajans</h1>
      <p id="nativeTitle" class="text-amber-200 text-xl mt-0.5"></p>
    </div>

  <div id="toolbar" class="sticky top-0 z-10 bg-[#FAF7F2]/95 backdrop-blur border-b border-amber-200 shadow-sm">
    <button type="button" id="toolbarToggle" aria-controls="toolbarBody" aria-expanded="true" aria-label="Hide toolbar" title="Hide toolbar"
            class="absolute right-0 md:right-2 top-full -mt-px w-9 h-7 flex items-center justify-center rounded-bl-lg md:rounded-b-lg border border-t-0 border-r-0 md:border-r border-amber-200 bg-[#FAF7F2] text-stone-500 shadow-sm">
      <svg id="toolbarChevron" class="w-5 h-5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>
    </button>
    <div id="toolbarBody" class="w-full px-4 md:px-8 py-2 space-y-2">
      <div class="flex items-center gap-2">
        <select id="langPicker" aria-label="Language" class="flex-1 min-w-0 text-xl font-semibold border border-vedic-bordergold rounded-md bg-white px-2 py-1.5 text-vedic-deepred"></select>
        <button type="button" id="sizeToggle" class="tool-btn w-11 h-11 rounded-md border border-stone-300 bg-white text-stone-700 text-xl font-semibold" aria-label="Text size" title="Text size" aria-expanded="false" aria-controls="sizeRow">Aa</button>
        <button type="button" id="scrollToggle" class="tool-btn w-11 h-11 rounded-md border border-stone-300 bg-white text-stone-700 flex items-center justify-center" aria-label="Auto scroll" title="Auto scroll" aria-pressed="false">
          <svg id="playIcon" class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
          <svg id="pauseIcon" class="w-6 h-6 hidden" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
      </div>
      <!-- Text size slider (opened by Aa) -->
      <div id="sizeRow" class="hidden flex items-center gap-2">
        <button type="button" class="step-btn" data-slider="sizeSlider" data-dir="-1" aria-label="Smaller text" title="Smaller text">−</button>
        <div class="relative flex-1 min-w-0">
          <input id="sizeSlider" type="range" min="0.8" max="1.6" step="0.05" class="slider block w-full" aria-label="Text size">
          <output id="sizeLabel" for="sizeSlider" class="slider-label text-sm font-semibold text-stone-500 tabular-nums">17px</output>
        </div>
        <button type="button" class="step-btn" data-slider="sizeSlider" data-dir="1" aria-label="Larger text" title="Larger text">+</button>
      </div>
      <!-- Auto-scroll speed slider (shown while scrolling) -->
      <div id="speedRow" class="hidden flex items-center gap-2">
        <button type="button" class="step-btn" data-slider="speedSlider" data-dir="-1" aria-label="Slower" title="Slower">−</button>
        <div class="relative flex-1 min-w-0">
          <input id="speedSlider" type="range" min="0.25" max="2" step="0.05" class="slider block w-full" aria-label="Scroll speed">
          <output id="speedLabel" for="speedSlider" class="slider-label text-sm font-semibold text-stone-500 tabular-nums">1x</output>
        </div>
        <button type="button" class="step-btn" data-slider="speedSlider" data-dir="1" aria-label="Faster" title="Faster">+</button>
      </div>
      <!-- Quick jump to a bhajan -->
      <select id="bhajanJump" aria-label="Jump to bhajan" class="w-full text-xl font-semibold border border-stone-300 rounded-md bg-white px-2 py-1.5 text-stone-800"></select>
    </div>
  </div>

  <main class="w-full px-4 md:px-8 pt-5 pb-24 flex-1 w-full space-y-5">
    <div id="bhajanList" class="space-y-5"></div>
  </main>

  <footer class="bg-stone-900 text-stone-400 pt-6 pb-24 text-center text-xl border-t border-vedic-gold/40 mt-6">
    <p class="font-title text-amber-200">Chunduru Family Sri Devi Navaratri Celebrations 2026</p>
    <p class="text-sm max-w-xl mx-auto px-4 mt-3">Texts and lyrics are shared for personal, non-commercial devotional use. All rights belong to their respective owners.</p>
    <p class="text-sm mt-1">Contact: <a href="mailto:dasara@vamsichunduru.com" class="underline hover:text-amber-200">dasara@vamsichunduru.com</a></p>
  </footer>

  <!-- Back to puja (when opened from the reader) · Schedule -->
  <nav class="fixed bottom-0 inset-x-0 z-10 bg-white/95 backdrop-blur border-t border-amber-200 shadow-[0_-4px_12px_rgba(0,0,0,0.06)]">
    <div class="w-full px-2 md:px-8 py-1.5 flex items-center gap-1.5">
      <a id="backLink" href="day.html" class="h-14 flex-1 min-w-0 rounded-lg border border-vedic-gold btn-soft px-2 text-xl font-semibold flex items-center gap-2 hidden"><svg class="w-9 h-9 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg><span id="backText" class="truncate"></span></a>
      <a id="scheduleLink" href="../index.html" class="h-14 w-14 btn-emboss flex-shrink-0 rounded-lg border border-stone-300 bg-white text-stone-700 flex flex-col items-center justify-center leading-none">
        <svg class="w-9 h-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9v11h13V9"/><path d="M10 20v-5.5h4V20"/></svg>
      </a>
    </div>
  </nav>

  <script src="data.js"></script>
  <script src="common.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(() => {});</script>
  <script>
    // Footer buttons are icon-only; the translated word is their accessible name and tooltip
    function setName(id, text) { const el = document.getElementById(id); el.setAttribute('aria-label', text); el.title = text; }
    const params = new URLSearchParams(location.search);
    const fromDay = params.get('day'), fromStep = params.get('step');
    let lang = initialLang();

    // Bhajans whose lyrics live on another site: title, credit, and one big button out.
    // The button opens the lyrics in the reading language when there's a page for it, else English.
    function linkCard(b, i, text) {
      const credit = text.credit ? (text.credit[lang] || text.credit.en) : '';
      const link = text.links[lang] || text.links.en;
      return `<section id="${b.id}" class="bg-white ornament-border rounded-xl px-5 py-5 md:px-8 scroll-mt-28">
          <div class="text-xl font-semibold text-amber-800 tracking-wide">${i + 1} / ${BHAJANS.length}</div>
          <h2 lang="${lang}" class="reading text-title text-xl md:text-2xl mt-0.5">${escapeHtml(text.title[lang])}</h2>
          ${credit ? `<p lang="${lang}" class="text-base text-stone-500 mt-1">${escapeHtml(credit)}</p>` : ''}
          <a href="${escapeHtml(link.href)}" target="_blank" rel="noopener noreferrer"
             class="btn-emboss-red mt-4 flex items-center justify-center gap-2 w-full sm:w-auto sm:inline-flex rounded-lg border border-vedic-gold text-amber-100 text-xl font-semibold px-6 py-3">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            <span lang="${lang}">${escapeHtml(UI.open_lyrics[lang])}</span>
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
          </a>
          ${link.site ? `<p lang="${lang}" class="text-sm text-stone-500 mt-2">${escapeHtml(UI.lyrics_on[lang])} ${escapeHtml(link.site)}</p>` : ''}
        </section>`;
    }

    function render() {
      document.documentElement.lang = lang;
      document.getElementById('langPicker').innerHTML = langOptions(lang);
      document.getElementById('nativeTitle').textContent = lang === 'en' ? '' : UI.bhajans[lang];
      const back = document.getElementById('backLink');
      back.classList.toggle('hidden', !fromDay);
      if (fromDay) {
        back.href = `day.html?day=${fromDay}&step=${fromStep || 1}&lang=${lang}`;
        // The arrow is an icon, so drop the text arrow from the translated label
        document.getElementById('backText').textContent = UI.back_to_puja[lang].replace(/^←\s*/, '');
      }
      setName('scheduleLink', UI.schedule[lang]);

      const current = location.hash.slice(1);
      document.getElementById('bhajanJump').innerHTML = BHAJANS.map((b, i) =>
        `<option value="${b.id}"${b.id === current ? ' selected' : ''}>${i + 1}. ${escapeHtml(b.title[lang])}</option>`
      ).join('');

      document.getElementById('bhajanList').innerHTML = BHAJANS.map((b, i) => {
        const text = TEXTS[b.text];
        if (text.links) return linkCard(b, i, text);
        // Shorten repeated choruses first, so chorus-only stanzas don't get a stanza number
        const blocks = numberStanzas(text.refrain ? shortenRefrains(text.blocks[lang]) : text.blocks[lang]);
        const { html } = renderBlocks(blocks, b.id);
        const note = text.note && text.note[lang] ? `<p class="text-xl text-stone-500 italic mt-1">${escapeHtml(text.note[lang])}</p>` : '';
        return `<section id="${b.id}" class="bg-white ornament-border rounded-xl px-5 py-5 md:px-8 scroll-mt-28">
          <div class="text-xl font-semibold text-amber-800 tracking-wide">${i + 1} / ${BHAJANS.length}</div>
          <h2 lang="${lang}" class="reading text-title text-xl md:text-2xl mt-0.5">${escapeHtml(text.title[lang])}</h2>
          ${note}
          <div lang="${lang}" class="reading mt-2">${html}</div>
        </section>`;
      }).join('');
    }

    // Picking a bhajan scrolls to it (and keeps the #id in the address for sharing)
    document.getElementById('bhajanJump').onchange = (e) => {
      AutoScroll.hold(900);
      document.getElementById(e.target.value)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      history.replaceState(null, '', '#' + e.target.value);
    };

    document.getElementById('langPicker').onchange = (e) => {
      lang = e.target.value;
      Prefs.set('pujaLang', lang);
      setUrlParams({ lang });
      render();
    };

    setupTextSize(document.querySelector('main'));
    AutoScroll.setup();
    setupToolbarToggle();
    Promise.all(BHAJANS.map(b => loadText(b.text))).then(() => {
      render();
      if (location.hash) {
        const jump = () => document.querySelector(location.hash)?.scrollIntoView();
        jump();
        // Web fonts arriving later shift the layout, so jump again once they've loaded
        document.fonts?.ready.then(jump);
      }
    });
  </script>
</body>
</html>
