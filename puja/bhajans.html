<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- No page zoom: pinching the text changes the reading size instead (setupPinchZoom) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bhajans | Sri Devi Navaratri 2026</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#4A0E17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Navaratri">
  <meta property="og:title" content="Bhajans | Sri Devi Navaratri 2026">
  <meta property="og:image" content="https://dasara2026.vamsichunduru.com/assets/om-512.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+Telugu:wght@400;600;700&family=Noto+Serif+Devanagari:wght@400;600;700&family=Noto+Serif+Kannada:wght@400;600;700&family=Noto+Serif+Tamil:wght@400;600;700&family=Noto+Serif+Malayalam:wght@400;600;700&family=Noto+Serif+Bengali:wght@400;600;700&family=Noto+Serif+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: {
      colors: { vedic: { gold: '#D4AF37', deepred: '#800000', darkmaroon: '#4A0E17', bordergold: '#E5C158' } },
      fontFamily: { title: ['Cinzel', 'serif'] }
    } } }
  </script>
  <link rel="stylesheet" href="reader.css">
</head>
<body class="min-h-screen flex flex-col">

  <!-- Title and toolbar stay pinned together at the top -->
  <div id="topBar" class="sticky top-0 z-20">
  <header class="bg-gradient-to-b from-vedic-darkmaroon to-vedic-deepred text-white py-4 px-4 md:px-8 text-center border-b-4 border-vedic-gold">
    <div class="w-full flex items-center justify-between gap-3">
      <span class="w-10 h-10 flex-shrink-0" aria-hidden="true"></span>
      <!-- The title opens the home page too, like the house button -->
      <a href="../index.html" class="block flex-1 text-center min-w-0 hover:opacity-90" title="Home">
        <h1 class="text-2xl md:text-4xl font-extrabold font-title tracking-wider text-amber-100 flex items-center justify-center gap-3"><svg class="inline-block flex-shrink-0 w-7 h-7 md:w-9 md:h-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 19V7.5c1.5.5 3 1.6 3 3.5"/><ellipse cx="5.6" cy="19" rx="2.4" ry="1.9" fill="currentColor"/><path d="M18.6 15V3.5c1.5.5 3 1.6 3 3.5"/><ellipse cx="16.2" cy="15" rx="2.4" ry="1.9" fill="currentColor"/></svg>Bhajans<svg class="inline-block flex-shrink-0 w-7 h-7 md:w-9 md:h-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 19V7.5c1.5.5 3 1.6 3 3.5"/><ellipse cx="5.6" cy="19" rx="2.4" ry="1.9" fill="currentColor"/><path d="M18.6 15V3.5c1.5.5 3 1.6 3 3.5"/><ellipse cx="16.2" cy="15" rx="2.4" ry="1.9" fill="currentColor"/></svg></h1>
        <p id="nativeTitle" class="text-amber-200 text-xl mt-0.5"></p>
      </a>
      <span class="w-10 h-10 flex-shrink-0" aria-hidden="true"></span>
    </div>
  </header>

  <div id="toolbar" class="bg-[#FAF7F2]/95 backdrop-blur border-b border-amber-200 shadow-sm">
    <div id="toolbarBody" class="w-full px-4 md:px-8 py-2 space-y-2">
      <div class="flex items-center gap-2">
        <!-- Top row: quick jump to a bhajan, then the language, text size, home and full screen buttons -->
        <select id="bhajanJump" aria-label="Jump to bhajan" class="appearance-none cursor-pointer flex-1 min-w-0 text-xl font-semibold border border-stone-300 rounded-md bg-white px-2 py-1.5 text-stone-800 truncate"></select>
        <select id="langPicker" aria-label="Language" class="hidden" tabindex="-1"></select>
        <button type="button" id="langBtn" class="tool-btn w-11 h-11 flex-shrink-0 rounded-md border btn-cream flex items-center justify-center" aria-label="Language" title="Language" aria-haspopup="dialog">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18"/><path d="M12 3a14 14 0 0 0 0 18"/></svg>
        </button>
        <button type="button" id="sizeToggle" class="tool-btn w-11 h-11 flex-shrink-0 rounded-md border btn-cream text-xl font-semibold" aria-label="Text size" title="Text size" aria-expanded="false" aria-controls="sizeRow">Aa</button>
        <a id="toolHome" href="../index.html" class="tool-btn w-11 h-11 flex-shrink-0 rounded-md border btn-cream flex items-center justify-center" aria-label="Home" title="Home">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9v11h13V9"/><path d="M10 20v-5.5h4V20"/></svg>
        </a>
        <button type="button" id="focusToggle" class="tool-btn w-11 h-11 flex-shrink-0 rounded-md border btn-cream flex items-center justify-center" aria-label="Full screen" title="Full screen">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg>
        </button>
      </div>
      <!-- Text size slider (opened by Aa) -->
      <div id="sizeRow" class="hidden flex items-center gap-2">
        <button type="button" class="step-btn" data-slider="sizeSlider" data-dir="-1" aria-label="Smaller text" title="Smaller text">−</button>
        <div class="relative flex-1 min-w-0">
          <input id="sizeSlider" type="range" min="0.8" max="1.6" step="0.05" class="slider block w-full" aria-label="Text size">
          <output id="sizeLabel" for="sizeSlider" class="slider-label text-sm font-semibold text-stone-500 tabular-nums">17px</output>
        </div>
        <button type="button" class="step-btn" data-slider="sizeSlider" data-dir="1" aria-label="Larger text" title="Larger text">+</button>
      </div>
    </div>
  </div>
  </div>

  <!-- Auto scroll: a floating play/pause with slower and faster buttons; drag it anywhere on the screen -->
  <div id="scrollDock" class="scroll-dock" role="group" aria-label="Auto scroll">
    <button type="button" class="dock-step" data-dir="-1" aria-label="Slower" title="Slower">−</button>
    <button type="button" id="scrollToggle" class="dock-play" aria-label="Auto scroll" title="Auto scroll" aria-pressed="false">
      <svg id="playIcon" class="w-7 h-7" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
      <svg id="pauseIcon" class="w-7 h-7 hidden" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      <output id="speedLabel" class="dock-speed" aria-label="Scroll speed">1</output>
    </button>
    <button type="button" class="dock-step" data-dir="1" aria-label="Faster" title="Faster">+</button>
  </div>
  <!-- Full screen: floating home and exit buttons together at the top right (sized and spaced in reader.css, like the toolbar buttons) -->
  <a id="focusHome" href="../index.html" class="hidden fixed top-1.5 right-[4.375rem] md:right-[6.375rem] z-30 h-14 w-14 btn-cream rounded-lg border flex items-center justify-center" aria-label="Home" title="Home"><svg class="w-9 h-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9v11h13V9"/><path d="M10 20v-5.5h4V20"/></svg></a>
  <button type="button" id="focusExit" class="hidden fixed top-1.5 right-2 md:right-10 z-30 h-14 w-14 btn-cream rounded-lg border flex items-center justify-center" aria-label="Exit full screen" title="Exit full screen"><svg class="w-9 h-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4"/><path d="M15 4v5h5"/><path d="M9 20v-5H4"/><path d="M15 20v-5h5"/></svg></button>

  <main class="w-full px-4 md:px-8 pt-5 flex-1 w-full space-y-5">
    <div id="bhajanList" class="space-y-5"></div>
  </main>


  <!-- Back to puja, when opened from the reader (home is the title bar at the top) -->
  <nav class="fixed bottom-0 inset-x-0 z-10 bg-white/95 backdrop-blur border-t border-amber-200 shadow-[0_-4px_12px_rgba(0,0,0,0.06)]">
    <div class="w-full px-2 md:px-8 py-1.5 flex items-center gap-1.5">
      <a id="backLink" href="day.html" class="h-14 flex-1 min-w-0 rounded-lg border btn-cream px-2 text-xl font-semibold flex items-center gap-2 hidden"><svg class="w-9 h-9 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg><span id="backText" class="truncate"></span></a>
    </div>
  </nav>

  <script src="data.js"></script>
  <script src="common.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(() => {});</script>
  <script>
    // Footer buttons are icon-only; the translated word is their accessible name and tooltip
    function setName(id, text) { const el = document.getElementById(id); el.setAttribute('aria-label', text); el.title = text; }
    const params = new URLSearchParams(location.search);
    const fromDay = params.get('day'), fromStep = params.get('step');
    let lang = initialLang();

    // Kabhi Durga Banke follows the Navaratri days: stanza N calls Day N's Devi. Today's stanza is sung twice
    // (repeated right where it is), and the stanzas for days still to come are grayed out. "Today" is the puja day
    // the page was opened from, else today's date; outside the ten days the song shows as written.
    const songDay = (() => {
      const d = parseInt(fromDay, 10);
      if (d >= 1 && d <= DAYS.length) return d;
      const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Los_Angeles' }).format(new Date());
      return DAYS.findIndex(x => x.date === today) + 1;
    })();
    function kabhiDurgaForDay(blocks) {
      if (!songDay || blocks.length !== DAYS.length + 2) return blocks;
      // The song's closing chorus line is dropped: each stanza already ends with the chorus
      // Today's stanza is written once, then a ↻ cue to sing it again, then the chorus cue
      const again = l => l.split(/\s+/).slice(0, 4).join(' ').replace(/[,.।॥|]+$/, '') + ' …';
      return blocks.slice(0, -1).flatMap((b, i) =>
        i === songDay ? [['text', b[1].slice(0, -1)], ['again', [again(b[1][0])]], ['text', b[1].slice(-1)]]
        : i > songDay ? [['muted', b[1]]]
        : [b]);
    }

    // Bhajans whose lyrics live on another site: title, credit, and one big button out.
    // The button opens the lyrics in the reading language when there's a page for it, else English.
    function linkCard(b, i, text) {
      const credit = text.credit ? (text.credit[lang] || text.credit.en) : '';
      const link = text.links[lang] || text.links.en;
      return `<section id="${b.id}" class="bg-white ornament-border rounded-xl px-5 py-5 md:px-8 scroll-mt-28">
          <div class="text-xl font-semibold text-amber-800 tracking-wide">${i + 1} / ${BHAJANS.length}</div>
          <h2 lang="${lang}" class="reading text-title text-xl md:text-2xl mt-0.5">${escapeHtml(text.title[lang])}</h2>
          ${credit ? `<p lang="${lang}" class="text-base text-stone-500 mt-1">${escapeHtml(credit)}</p>` : ''}
          <a href="${escapeHtml(link.href)}" target="_blank" rel="noopener noreferrer"
             class="btn-emboss-red mt-4 flex items-center justify-center gap-2 w-full sm:w-auto sm:inline-flex rounded-lg border border-vedic-gold text-amber-100 text-xl font-semibold px-6 py-3">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            <span lang="${lang}">${escapeHtml(UI.open_lyrics[lang])}</span>
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
          </a>
          ${link.site ? `<p lang="${lang}" class="text-sm text-stone-500 mt-2">${escapeHtml(UI.lyrics_on[lang])} ${escapeHtml(link.site)}</p>` : ''}
        </section>`;
    }

    function render() {
      document.documentElement.lang = lang;
      document.getElementById('langPicker').innerHTML = langOptions(lang);
      document.getElementById('nativeTitle').textContent = lang === 'en' ? '' : UI.bhajans[lang];
      const back = document.getElementById('backLink');
      back.classList.toggle('hidden', !fromDay);
      // Back to puja is the bar's only button, so there's no bar without it
      back.closest('nav').classList.toggle('hidden', !fromDay);
      if (fromDay) {
        back.href = `day.html?day=${fromDay}&step=${fromStep || 1}&lang=${lang}`;
        // The arrow is an icon, so drop the text arrow from the translated label
        document.getElementById('backText').textContent = UI.back_to_puja[lang].replace(/^←\s*/, '');
      }

      const current = location.hash.slice(1);
      document.getElementById('bhajanJump').innerHTML = BHAJANS.map((b, i) =>
        `<option value="${b.id}"${b.id === current ? ' selected' : ''}>${i + 1}. ${escapeHtml(b.title[lang])}</option>`
      ).join('');

      document.getElementById('bhajanList').innerHTML = BHAJANS.map((b, i) => {
        const text = TEXTS[b.text];
        if (text.links) return linkCard(b, i, text);
        // Shorten repeated choruses first, so chorus-only stanzas don't get a stanza number
        const source = b.id === 'kabhi-durga' ? kabhiDurgaForDay(text.blocks[lang]) : text.blocks[lang];
        const blocks = numberStanzas(text.refrain ? shortenRefrains(source) : source);
        const { html } = renderBlocks(blocks, b.id);
        const note = text.note && text.note[lang] ? `<p class="text-xl text-stone-500 italic mt-1">${escapeHtml(text.note[lang])}</p>` : '';
        return `<section id="${b.id}" class="bg-white ornament-border rounded-xl px-5 py-5 md:px-8 scroll-mt-28">
          <div class="text-xl font-semibold text-amber-800 tracking-wide">${i + 1} / ${BHAJANS.length}</div>
          <h2 lang="${lang}" class="reading text-title text-xl md:text-2xl mt-0.5">${escapeHtml(text.title[lang])}</h2>
          ${note}
          <div lang="${lang}" class="reading mt-2">${html}</div>
        </section>`;
      }).join('');
    }

    // Picking a bhajan scrolls to it (and keeps the #id in the address for sharing)
    document.getElementById('bhajanJump').onchange = (e) => {
      AutoScroll.hold(900);
      document.getElementById(e.target.value)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      history.replaceState(null, '', '#' + e.target.value);
    };

    document.getElementById('langPicker').onchange = (e) => {
      lang = e.target.value;
      Prefs.set('pujaLang', lang);
      setUrlParams({ lang });
      render();
    };

    setupTextSize(document.querySelector('main'));
    setupPickers();
    promptLanguageIfUnset();
    AutoScroll.setup();
    setupFocusMode();
    trackBottomBar();
    Promise.all(BHAJANS.map(b => loadText(b.text))).then(() => {
      render();
      if (location.hash) {
        const jump = () => document.querySelector(location.hash)?.scrollIntoView();
        jump();
        // Web fonts arriving later shift the layout, so jump again once they've loaded
        document.fonts?.ready.then(jump);
      }
    });
  </script>
</body>
</html>
